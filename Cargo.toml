[package]
name = "hex-arm-dynamics"
version = "0.1.1"
edition = "2021"
authors = ["kisonhe <kisonhe@hexmeow.com>"]
license = "MIT"
description = "Serial-arm kinematics and gravity torque G(q) from a URDF: forward kinematics + gravity compensation, hand-rolled linear algebra (urdf-rs only, no nalgebra). One shared model for controller gravity-comp, host-side tau_ff feedforward, and sim gravity load."
repository = "https://github.com/hex-meow/hex-arm-dynamics"
keywords = ["robotics", "urdf", "kinematics", "gravity", "manipulator"]
categories = ["science::robotics", "mathematics"]

[dependencies]
anyhow = "1"
urdf-rs = "0.9.0"
